<title>Detail Twin Samples</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a detailing workstation. Case tabs on top, a true-scale viewport with its tool strip
   on the left, and one inspector column (part, parts list, checks, notes) on the right. */
:root {
  --bg: #eef1f4; --panel: #ffffff; --panel2: #f5f7f9; --line: #d3d9e0; --fg: #18202a; --muted: #5a6675;
  --accent: #1c5bc9; --accent-fg: #ffffff; --ok: #17794a; --bad: #be3526; --hl: #f08c00;
  --vp1: #f6f8fa; --vp2: #d9e0e8; --edge: #10151b; --grid: #8c98a6; --dim: #0d47ad; --label: rgba(255,255,255,.9);
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1216; --panel: #161b21; --panel2: #1b2129; --line: #2b343f; --fg: #e4e9ef; --muted: #94a1b0;
  --accent: #6ea8ff; --accent-fg: #0a1220; --ok: #4fc48d; --bad: #ff8070; --hl: #ffb340;
  --vp1: #262e39; --vp2: #12161b; --edge: #040608; --grid: #5b6775; --dim: #9cc3ff; --label: rgba(18,22,27,.88);
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1216; --panel: #161b21; --panel2: #1b2129; --line: #2b343f; --fg: #e4e9ef; --muted: #94a1b0;
  --accent: #6ea8ff; --accent-fg: #0a1220; --ok: #4fc48d; --bad: #ff8070; --hl: #ffb340;
  --vp1: #262e39; --vp2: #12161b; --edge: #040608; --grid: #5b6775; --dim: #9cc3ff; --label: rgba(18,22,27,.88);
  color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 13px; line-height: 1.4; }
* { box-sizing: border-box; }
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 8px; padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand .name { font-weight: 600; font-size: 15px; letter-spacing: .01em; }
.brand .tag { color: var(--muted); font-size: 12px; }
.cases { display: flex; flex-wrap: wrap; gap: 4px; margin-left: auto; }
.cases button { font: inherit; color: var(--muted); background: transparent; border: 1px solid transparent; border-radius: 3px;
  padding: 5px 10px; cursor: pointer; display: flex; gap: 7px; align-items: baseline; }
.cases button .n { font-family: var(--mono); font-size: 11px; }
.cases button:hover { color: var(--fg); background: var(--panel2); }
.cases button[aria-selected="true"] { color: var(--fg); background: var(--panel); border-color: var(--line); font-weight: 500; }
.cases button[aria-selected="true"] .n { color: var(--accent); }
.work { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 8px; min-height: 0; }
.stage, .side { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; min-height: 0; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.tools { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--line); background: var(--panel2); }
.grp { display: flex; align-items: center; gap: 3px; }
.grp > span.l { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; margin-right: 4px; }
.tb { font: inherit; font-size: 12px; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 3px 8px; cursor: pointer; min-height: 26px; }
.tb:hover { border-color: var(--muted); }
.tb[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.tb:focus-visible, .cases button:focus-visible, .tabs button:focus-visible, input:focus-visible, select:focus-visible, tr:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
select.tb { padding-right: 4px; }
input[type=range] { width: 110px; accent-color: var(--accent); }
.vp { position: relative; flex: 1; min-height: 240px; background: linear-gradient(180deg, var(--vp1), var(--vp2)); overflow: hidden; touch-action: none; }
.vp canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.dl { position: absolute; transform: translate(-50%, -50%); font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--dim);
  background: var(--label); padding: 0 4px; border-radius: 2px; white-space: nowrap; }
.dl.m { color: var(--fg); border: 1px solid var(--hl); }
#tip { position: absolute; pointer-events: none; background: var(--fg); color: var(--panel); font-size: 11.5px; padding: 3px 7px; border-radius: 3px; white-space: nowrap; transform: translate(12px, 14px); }
#tip b { font-family: var(--mono); font-weight: 500; margin-right: 6px; }
#triad { position: absolute; left: 8px; bottom: 8px; width: 64px; height: 64px; pointer-events: none; }
#triad text { font-family: var(--mono); font-size: 10px; fill: var(--fg); }
#scalebar { position: absolute; right: 12px; bottom: 10px; font-family: var(--mono); font-size: 11px; color: var(--fg); text-align: center; pointer-events: none; }
#scalebar i { display: block; height: 6px; border: 1.5px solid var(--fg); border-top: 0; margin-bottom: 2px; }
#readout { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 5px 10px;
  font-family: var(--mono); font-size: 12px; white-space: nowrap; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; }
#readout b { color: var(--hl); font-weight: 500; }
.status { display: flex; flex-wrap: wrap; gap: 2px 16px; padding: 4px 10px; border-top: 1px solid var(--line); color: var(--muted); font-family: var(--mono); font-size: 11px; background: var(--panel2); }
.case-head { padding: 10px 12px 8px; border-bottom: 1px solid var(--line); }
.case-head h1 { margin: 0; font-size: 15px; font-weight: 600; text-wrap: balance; }
.case-head p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
.tabs { display: flex; border-bottom: 1px solid var(--line); background: var(--panel2); }
.tabs button { flex: 1; font: inherit; font-size: 12px; color: var(--muted); background: transparent; border: 0; border-bottom: 2px solid transparent; padding: 7px 4px; cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 500; }
.tabs .cnt { font-family: var(--mono); font-size: 10.5px; margin-left: 4px; }
.tabs .cnt.bad { color: var(--bad); } .tabs .cnt.ok { color: var(--ok); }
.pane { flex: 1; min-height: 0; overflow: auto; padding: 10px 12px; }
.hint { color: var(--muted); }
.pm { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
.pm .mk { font-family: var(--mono); font-weight: 500; color: var(--accent); border: 1px solid var(--line); border-radius: 3px; padding: 0 6px; }
.pm .nm { font-weight: 500; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
td, th { text-align: left; padding: 4px 6px 4px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
td.k { color: var(--muted); width: 42%; }
td.v, td.num, th.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
td.num, th.num { text-align: right; padding-right: 0; padding-left: 6px; white-space: nowrap; }
.bom tr[data-mark] { cursor: pointer; }
.bom tr[data-mark]:hover td, .bom tr.on td { background: var(--panel2); }
.bom td.mk { font-family: var(--mono); color: var(--accent); white-space: nowrap; }
.bom tfoot td { font-weight: 500; border-bottom: 0; }
.src { margin-top: 10px; font-size: 11.5px; color: var(--muted); }
.src b { color: var(--fg); font-weight: 500; }
.chk { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 8px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.chk .pill { grid-row: span 2; align-self: start; font-family: var(--mono); font-size: 10.5px; font-weight: 500; padding: 1px 6px; border-radius: 2px; border: 1px solid currentColor; }
.chk .pill.ok { color: var(--ok); } .chk .pill.bad { color: var(--bad); }
.chk .w { font-weight: 500; }
.chk .d { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.chk .d b { color: var(--fg); font-weight: 500; }
.notes li { margin-bottom: 6px; } .notes { padding-left: 16px; margin: 0; }
.sum { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; margin-top: 10px; }
.sum div span { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
.sum div b { font-family: var(--mono); font-weight: 500; font-size: 14px; }
@media (max-width: 860px) {
  html, body { height: auto; }
  .app { height: auto; }
  .work { grid-template-columns: minmax(0, 1fr); }
  .vp { flex: none; height: 62vh; }
  .cases { margin-left: 0; }
  .side { max-height: none; }
  .pane { overflow: visible; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header class="top">
    <div class="brand"><span class="name">Detail Twin</span><span class="tag">to-scale structural details, sample set</span></div>
    <nav class="cases" id="cases" role="tablist" aria-label="Sample cases"></nav>
  </header>
  <main class="work">
    <section class="stage" aria-label="Model">
      <div class="tools">
        <div class="grp"><span class="l">View</span>
          <button class="tb" data-view="iso">Iso</button><button class="tb" data-view="front">Front</button>
          <button class="tb" data-view="right">Side</button><button class="tb" data-view="top">Plan</button>
          <button class="tb" id="b-fit">Fit</button>
          <button class="tb" id="b-proj" aria-pressed="true" title="Orthographic keeps true scale">Ortho</button></div>
        <div class="grp"><span class="l">Show</span>
          <button class="tb" id="b-edges" aria-pressed="true">Edges</button>
          <button class="tb" id="b-dims" aria-pressed="true">Dimensions</button>
          <button class="tb" id="b-xray" aria-pressed="false" title="See through concrete and sheathing">X-ray</button></div>
        <div class="grp"><span class="l">Section</span>
          <button class="tb" id="b-sec" aria-pressed="false">Cut</button>
          <select class="tb" id="s-axis" aria-label="Section axis"><option value="x">X</option><option value="y">Y</option><option value="z">Z</option></select>
          <input type="range" id="r-sec" min="0" max="1000" value="500" aria-label="Section position">
          <button class="tb" id="b-flip" title="Keep the other side">Flip</button></div>
        <div class="grp"><span class="l">Explode</span>
          <input type="range" id="r-ex" min="0" max="1000" value="0" aria-label="Explode"></div>
        <div class="grp"><button class="tb" id="b-meas" aria-pressed="false" title="Click two points. Snaps to corners.">Measure</button></div>
      </div>
      <div class="vp" id="vp">
        <canvas id="gl" tabindex="0" aria-label="3D model view"></canvas>
        <div id="labels"></div>
        <svg id="triad" viewBox="-32 -32 64 64" aria-hidden="true"></svg>
        <div id="scalebar" hidden><i></i><span></span></div>
        <div id="readout" hidden></div>
        <div id="tip" hidden></div>
      </div>
      <footer class="status" id="status"></footer>
    </section>
    <aside class="side" aria-label="Inspector">
      <div class="case-head"><h1 id="c-title"></h1><p id="c-blurb"></p></div>
      <div class="tabs" role="tablist" id="tabs">
        <button role="tab" data-tab="part" aria-selected="true">Part</button>
        <button role="tab" data-tab="bom" aria-selected="false">Parts list</button>
        <button role="tab" data-tab="checks" aria-selected="false">Checks<span class="cnt" id="chk-cnt"></span></button>
        <button role="tab" data-tab="notes" aria-selected="false">Notes</button>
      </div>
      <div class="pane" id="pane"></div>
    </aside>
  </main>
</div>

<script type="application/json" id="dt-data">/*__DATA__*/</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
(() => {
const DATA = JSON.parse(document.getElementById('dt-data').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const Q = new URLSearchParams(location.search);
if (Q.get('theme')) document.documentElement.setAttribute('data-theme', Q.get('theme'));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches || Q.has('shot');
THREE.Object3D.DefaultUp.set(0, 0, 1);

// ---- material classes: display colour, finish, section hatch, draw order of the cut faces
const CLS = {
  concrete: {c:0xbdbab3, m:0, r:.95, o:0, hatch:['stipple','#cfcdc7','#77736b',6]},
  grout:    {c:0x8f948e, m:0, r:.9,  o:1, hatch:['stipple','#a3a8a1','#4e524d',3]},
  sheathing:{c:0xbd9a60, m:0, r:.85, o:2, hatch:['lines','#c9a56b','#7b5a28',16,1.5]},
  wood:     {c:0xd2ae76, m:0, r:.8,  o:3, hatch:['lines','#dbb981','#8a6328',16,3]},
  sill:     {c:0x8d8a5c, m:0, r:.8,  o:4, hatch:['lines','#9a9767','#4d4b2a',16,3]},
  steel:    {c:0x4d5a68, m:.2, r:.62, o:5, hatch:['lines','#55606b','#161a1f',8,.6]},
  plate:    {c:0x6f8296, m:.2, r:.58, o:6, hatch:['lines','#7c8792','#1d2228',8,.6]},
  weld:     {c:0xd08a2e, m:.3, r:.55, o:7, hatch:['solid','#b8701f']},
  rebar:    {c:0x7a4433, m:.1, r:.72, o:8, hatch:['solid','#1b1e22']},
  tie:      {c:0xa2633f, m:.1, r:.72, o:9, hatch:['solid','#1b1e22']},
  anchor:   {c:0xb4b8bc, m:.8, r:.4,  o:10, hatch:['solid','#2a2f35']},
  bolt:     {c:0xbcc0c4, m:.85, r:.36, o:11, hatch:['solid','#2a2f35']},
  connector:{c:0xaab1b7, m:.8, r:.42, o:12, hatch:['lines','#aab1b7','#30363d',8,1.2]},
  nail:     {c:0x9299a0, m:.75, r:.42, o:13, hatch:['solid','#2a2f35']},
};
const GHOST = new Set(['concrete', 'grout', 'sheathing']);

const vp = $('#vp'), canvas = $('#gl'), labels = $('#labels'), tip = $('#tip');
const renderer = new THREE.WebGLRenderer({canvas, antialias: true, alpha: true, stencil: true});
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.localClippingEnabled = true;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new THREE.RoomEnvironment(), 0.04).texture;
const sun = new THREE.DirectionalLight(0xffffff, 1.25); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
scene.add(sun, sun.target, new THREE.HemisphereLight(0xffffff, 0x8a8f96, 0.25));

const persp = new THREE.PerspectiveCamera(30, 1, 0.5, 20000);
const ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, -20000, 20000);
let cam = ortho;
const controls = new THREE.OrbitControls(cam, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.14; controls.rotateSpeed = 0.9; controls.zoomSpeed = 1.1;
let dirty = true; controls.addEventListener('change', () => dirty = true);

const clip = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const S = {i: -1, root: null, parts: [], box: new THREE.Box3(), R: 10, C: new THREE.Vector3(), halfH: 10, ex: 0, sec: false, axis: 'y', flip: 1,
  edges: true, dims: true, xray: false, sel: null, selMark: null, hover: null, measure: false, mpts: [], tab: 'part', caps: null, dimObj: null, tw: null};
const mats = {}, tints = {};
let css = {};
function readCss() { const g = getComputedStyle(document.documentElement); const v = n => g.getPropertyValue(n).trim();
  css = {edge: v('--edge'), grid: v('--grid'), dim: v('--dim'), hl: v('--hl')}; }

function baseMat(cls) {
  if (!mats[cls]) { const k = CLS[cls] || CLS.steel;
    mats[cls] = new THREE.MeshStandardMaterial({color: lin(k.c), metalness: k.m, roughness: k.r, envMapIntensity: .9, clipShadows: true}); }
  const m = mats[cls], ghost = S.xray && GHOST.has(cls);
  m.transparent = ghost; m.opacity = ghost ? .16 : 1; m.depthWrite = !ghost; m.clippingPlanes = S.sec ? [clip] : []; m.needsUpdate = true;
  return m;
}
function tintMat(cls, mode) {
  const key = cls + mode;
  if (!tints[key]) { const m = baseMat(cls).clone(); m.emissive = lin(css.hl); m.emissiveIntensity = mode === 'sel' ? .55 : .28;
    if (m.transparent) { m.opacity = .5; } tints[key] = m; }
  return tints[key];
}
function refreshMats() { for (const k in tints) { tints[k].dispose(); delete tints[k]; }
  for (const p of S.parts) { p.mesh.material = matOf(p); p.mesh.castShadow = p.mesh.receiveShadow = !(S.xray && GHOST.has(p.d.cls)); } edgeMat(); dirty = true; }
function matOf(p) { const mode = (S.sel === p || (S.selMark && p.d.mark === S.selMark)) ? 'sel' : (S.hover === p ? 'hov' : null);
  return mode ? tintMat(p.d.cls, mode) : baseMat(p.d.cls); }
let _edgeMat;
function edgeMat() { if (!_edgeMat) _edgeMat = new THREE.LineBasicMaterial({transparent: true, opacity: .62});
  _edgeMat.color.copy(lin(css.edge)); _edgeMat.clippingPlanes = S.sec ? [clip] : []; _edgeMat.needsUpdate = true; return _edgeMat; }

const lin = c => new THREE.Color(c).convertSRGBToLinear();
const f32 = s => { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u.buffer; };

function fmtIn(x, den = 16) { const neg = x < 0; x = Math.abs(x); let n = Math.round(x * den); const whole = Math.floor(n / den); let rem = n - whole * den, d = den;
  while (rem && rem % 2 === 0) { rem /= 2; d /= 2; } const ft = Math.floor(whole / 12), inch = whole - ft * 12, fr = rem ? rem + '/' + d : '';
  const s = ft ? `${ft}'-${inch}${fr ? ' ' + fr : ''}"` : (fr && inch ? `${inch} ${fr}"` : fr ? `${fr}"` : `${inch}"`); return (neg ? '-' : '') + s; }

// ---- build a case ------------------------------------------------------------------------
function loadCase(i) {
  if (S.root) { scene.remove(S.root); S.root.traverse(o => { if (o.geometry && !o.userData.shared) o.geometry.dispose(); }); }
  const c = DATA[i]; S.i = i; S.parts = []; S.sel = S.selMark = S.hover = null; S.mpts = []; S.caps = null;
  S.root = new THREE.Group(); scene.add(S.root);
  S.xray = !!(c.view && c.view.xray); S.sec = false; S.axis = (c.view && c.view.section && c.view.section.axis) || 'y'; S.flip = 1;
  const G = {};
  for (const k in c.geoms) { const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(f32(c.geoms[k].pos)), 3));
    g.setIndex(new THREE.BufferAttribute(new Uint32Array(f32(c.geoms[k].idx)), 1));
    g.computeVertexNormals(); g.computeBoundingBox(); G[k] = {g, e: new THREE.EdgesGeometry(g, 30)}; }
  S.box.makeEmpty(); const em = edgeMat();
  c.parts.forEach((d, n) => {
    const base = new THREE.Matrix4().set(...d.m);
    const mesh = new THREE.Mesh(G[d.geom].g, baseMat(d.cls)); mesh.matrixAutoUpdate = false; mesh.castShadow = mesh.receiveShadow = true; mesh.renderOrder = 30;
    const line = new THREE.LineSegments(G[d.geom].e, em); line.matrixAutoUpdate = false; line.renderOrder = 31;
    const p = {d, n, base, mesh, line, st: null}; mesh.userData.p = p; S.parts.push(p); S.root.add(mesh, line);
    S.box.union(G[d.geom].g.boundingBox.clone().applyMatrix4(base));
  });
  const sph = S.box.getBoundingSphere(new THREE.Sphere()); S.R = sph.radius; S.C.copy(sph.center);
  // ground, shadow and a one-foot grid
  const z0 = S.box.min.z - 0.02, ext = Math.ceil(S.R * 1.25 / 12) * 12;
  const gnd = new THREE.Mesh(new THREE.PlaneGeometry(ext * 2, ext * 2), new THREE.ShadowMaterial({opacity: .2}));
  gnd.position.set(S.C.x, S.C.y, z0); gnd.receiveShadow = true; S.root.add(gnd);
  const gp = [], cx = Math.round(S.C.x / 12) * 12, cy = Math.round(S.C.y / 12) * 12;
  for (let t = -ext; t <= ext; t += 12) { gp.push(cx + t, cy - ext, z0, cx + t, cy + ext, z0, cx - ext, cy + t, z0, cx + ext, cy + t, z0); }
  const gg = new THREE.BufferGeometry(); gg.setAttribute('position', new THREE.Float32BufferAttribute(gp, 3));
