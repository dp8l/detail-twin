[project]
name = "detailtwin"
version = "0.1.0"
description = "To-scale structural details as exact solids, with measured checks, STEP, IFC and a detailing viewer"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["build123d>=0.13,<0.14", "numpy>=2", "openpyxl"]

[project.urls]
Homepage = "https://dp8l.github.io/detail-twin/"
Repository = "https://github.com/dp8l/detail-twin"

[project.optional-dependencies]
ifc = ["ifcopenshell>=0.8"]
dev = ["pytest>=8", "pyvista>=0.44", "ifcopenshell>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/detailtwin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
